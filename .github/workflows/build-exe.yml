name: build-fish-buddy-exe

# 手动点一下就能出包；打 v* 标签也会自动出包并传到 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: 装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # 挂件本体要的（照 spec 里 hiddenimports / collect_* 列的来）
          python -m pip install `
            pillow numpy onnxruntime sherpa-onnx `
            sounddevice soundcard pycaw comtypes proctap `
            pyinstaller
          # ⭐ 桥要的 —— 少这一行，打出来的 exe 里没有 websockets，桥会静默不启动
          python -m pip install websockets

      - name: 自检（缺依赖就早点炸，别等到打完才发现）
        shell: pwsh
        run: |
          python -c "import sys, PIL, numpy, onnxruntime, sherpa_onnx, sounddevice, pycaw, proctap, websockets, PyInstaller; print('deps ok', sys.version)"

      - name: 语法自检（改动过的两个文件）
        shell: pwsh
        run: |
          python -m py_compile app/ball.py app/挂件桥.py
          Write-Host 'py_compile ok'

      - name: 打包
        shell: pwsh
        working-directory: app
        run: |
          python -m PyInstaller --noconfirm --clean build/鱼搭子.spec

      - name: 看产物
        shell: pwsh
        run: |
          Get-ChildItem app/dist | Format-Table Name, Length

      - name: 传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 鱼搭子-exe
          path: app/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 打标签时顺手上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "自动构建" }
          gh release upload $tag (Get-ChildItem app/dist/*.exe).FullName --clobber
